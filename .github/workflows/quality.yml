name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          cache: true
          require-lockfile: true

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Run repository quality gate
        run: pnpm check
